name: Deploy Docs

on:
  push:
    branches:
      - main
      - pre
  workflow_dispatch:

permissions:
  contents: write

# main and pre both commit to gh-pages; don't let them race
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each branch gets its own folder on the site; the navbar dropdown switches between them
      - name: Build
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then export SITE_VERSION=release; else export SITE_VERSION=pre; fi
          echo "SITE_VERSION=$SITE_VERSION" >> "$GITHUB_ENV"
          npm run build

      # Replace only this version's folder; the root redirect to release/ and the other version stay
      - name: Publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin gh-pages --depth=1
          git worktree add pages origin/gh-pages
          rm -rf "pages/$SITE_VERSION"
          cp -r build "pages/$SITE_VERSION"
          cd pages
          git add -A
          git commit -m "Deploy $SITE_VERSION from ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:gh-pages
